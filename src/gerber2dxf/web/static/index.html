<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>gerber2dxf</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◔</span>
      <span class="name">gerber2dxf</span>
      <span class="tag">Gerber / Excellon → DXF</span>
    </div>
    <div class="topbar-right">
      <span id="project-name" class="chip">—</span>
      <span id="status" class="chip status-chip">готов</span>
    </div>
  </header>

  <main class="layout">
    <aside class="panel left">
      <section class="block">
        <h3>Исходники</h3>
        <div id="dropzone" class="dropzone">
          <div class="dz-icon">⬆</div>
          <div class="dz-text">Перетащите файлы Gerber/Excellon сюда<br /><small>или выберите:</small></div>
          <div class="dz-actions">
            <label class="btn">
              Файлы…
              <input id="file-input" type="file" multiple hidden
                accept=".gbr,.grb,.pho,.art,.gtl,.gbl,.gts,.gbs,.gtp,.gbp,.gto,.gbo,.gko,.gdl,.gm1,.gm2,.gm3,.gm13,.gm15,.gpt,.gpb,.drl,.txt,.exc,.xln,.zip,.GBR,.GRB,.PHO,.ART,.GTL,.GBL,.GTS,.GBS,.GTP,.GBP,.GTO,.GBO,.GKO,.GDL,.GM1,.GM2,.GM3,.GM13,.GM15,.GPT,.GPB,.DRL,.TXT,.EXC,.XLN,.ZIP" />
            </label>
            <button id="pick-folder-btn" class="btn">Папка…</button>
          </div>
        </div>

        <details class="folder-details">
          <summary>Или путь к локальной папке</summary>
          <div class="row">
            <input id="folder-path" class="text" placeholder="C:\path\to\Gerber_..." />
            <button id="folder-load-btn" class="btn small">Загрузить</button>
          </div>
        </details>
      </section>

      <section class="block">
        <div class="block-head">
          <h3>Слои</h3>
          <div class="layer-actions">
            <button id="all-on" class="btn tiny">Все</button>
            <button id="all-off" class="btn tiny">Ничего</button>
          </div>
        </div>
        <ul id="layers-list" class="layers"></ul>
      </section>
    </aside>

    <section class="viewport-wrap">
      <div class="viewport-toolbar">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="gerber" role="tab" aria-selected="true">Gerber</button>
          <button class="tab" data-tab="dxf" role="tab" aria-selected="false">DXF</button>
        </div>
        <span class="sep"></span>
        <button id="zoom-fit" class="btn tiny" title="Вписать">Fit</button>
        <button id="zoom-in" class="btn tiny" title="Увеличить">+</button>
        <button id="zoom-out" class="btn tiny" title="Уменьшить">−</button>
        <button id="dxf-refresh" class="btn tiny hidden" title="Перерендерить DXF">↻</button>
        <span class="sep"></span>
        <span id="cursor-xy" class="mono"></span>
        <span class="sep"></span>
        <span id="bbox-info" class="mono"></span>
      </div>
      <div id="viewport" class="viewport">
        <svg id="preview" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="preview-dxf" class="preview-dxf hidden"></div>
        <div id="loading" class="loading hidden">
          <div class="spinner"></div><span>Обработка…</span>
        </div>
      </div>
    </section>

    <aside class="panel right">
      <section class="block">
        <h3>Параметры DXF</h3>

        <label class="field">
          <span>Префикс имён</span>
          <input id="prefix" class="text" placeholder="имя_проекта" />
        </label>

        <label class="field inline">
          <input id="flip-y" type="checkbox" />
          <span>Отразить Y (flip Y)</span>
        </label>

        <label class="field">
          <span>Масштаб</span>
          <input id="scale" class="text" type="number" step="0.0001" value="1" />
        </label>

        <div class="field two">
          <label>
            <span>Сдвиг X</span>
            <input id="tx" class="text" type="number" step="0.001" value="0" />
          </label>
          <label>
            <span>Сдвиг Y</span>
            <input id="ty" class="text" type="number" step="0.001" value="0" />
          </label>
        </div>

        <label class="field inline">
          <input id="merge" type="checkbox" />
          <span>Один DXF со слоями AutoCAD</span>
        </label>

        <button id="export-btn" class="btn primary wide">Экспорт DXF</button>
      </section>

    </aside>
  </main>

  <footer class="bottombar">
    <div id="toast" class="toast hidden"></div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
